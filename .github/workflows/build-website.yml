name: Website CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    concurrency:
      group: website-build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Check project
        run: ./gradlew check

      - name: Build production Wasm website
        run: ./gradlew :website:wasmJsBrowserDistribution

      - name: Prepare optimized static assets
        run: |
          sudo apt-get update
          sudo apt-get install -y brotli
          deploy/prepare-web-release.sh

      - name: Upload static website artifact
        uses: actions/upload-artifact@v6
        with:
          name: itzephir-website
          path: website/build/dist/wasmJs/productionExecutable
          if-no-files-found: error
          retention-days: 14

  deploy:
    name: Deploy ${{ github.event_name == 'pull_request' && 'PR preview' || 'production' }}
    # Forks and Dependabot PRs are checked, but never receive deployment secrets.
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.user.login != 'dependabot[bot]')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'production' || 'development' }}
      url: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'https://itzephir.com' || 'https://dev.itzephir.com' }}
    concurrency:
      group: website-deploy-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'production' || 'development' }}
      cancel-in-progress: false
    permissions:
      contents: read

    steps:
      - name: Download production website
        uses: actions/download-artifact@v7
        with:
          name: itzephir-website
          path: dist

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/itzephir_deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/itzephir_deploy ~/.ssh/known_hosts

      - name: Select environment
        id: environment
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/main" ]]; then
            echo "target=prod" >> "$GITHUB_OUTPUT"
            echo "host=itzephir.com" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            echo "target=dev" >> "$GITHUB_OUTPUT"
            echo "host=dev.itzephir.com" >> "$GITHUB_OUTPUT"
          else
            echo "This event is not allowed to deploy" >&2
            exit 1
          fi

      - name: Deploy atomically
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          TARGET: ${{ steps.environment.outputs.target }}
          SITE_HOST: ${{ steps.environment.outputs.host }}
        run: |
          release="${GITHUB_SHA::12}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          base="/srv/itzephir/$TARGET"
          ssh_args=(-i ~/.ssh/itzephir_deploy -o BatchMode=yes)

          ssh "${ssh_args[@]}" "$DEPLOY_USER@$DEPLOY_HOST" \
            "mkdir -p '$base/releases/$release'"

          rsync -az --delete --chmod=D755,F644 \
            -e "ssh -i ~/.ssh/itzephir_deploy -o BatchMode=yes" \
            dist/ "$DEPLOY_USER@$DEPLOY_HOST:$base/releases/$release/"

          ssh "${ssh_args[@]}" "$DEPLOY_USER@$DEPLOY_HOST" \
            "ln -sfn '$base/releases/$release' '$base/current.next' && \
             mv -Tf '$base/current.next' '$base/current' && \
             curl -fsS --resolve '$SITE_HOST:443:127.0.0.1' \
               'https://$SITE_HOST/' >/dev/null && \
             find '$base/releases' -mindepth 1 -maxdepth 1 -type d \
               ! -name '$release' -mtime +7 -exec rm -rf -- {} +"

  preview-link:
    name: Publish preview link
    if: github.event_name == 'pull_request'
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Update preview comment
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: issue_number });
            if (pr.state !== 'open' || pr.head.sha !== context.payload.pull_request.head.sha) {
              core.notice('Skipping preview comment for a closed or outdated PR revision.');
              return;
            }
            const marker = '<!-- itzephir-development-preview -->';
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const body = [
              marker,
              '✅ Preview готов: **[dev.itzephir.com](https://dev.itzephir.com)**',
              '',
              `Коммит PR: \`${pr.head.sha.slice(0, 7)}\` · [Проверки и деплой](${runUrl})`,
              '',
              'Это общий тестовый стенд: его обновляет последний успешный PR-деплой. Production не изменялся.',
            ].join('\n');
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const previous = comments.find(comment =>
              comment.user?.login === 'github-actions[bot]' && comment.body?.includes(marker));
            if (previous) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: previous.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
