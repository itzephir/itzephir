name: itzephir-opendesign
services:
  workspace:
    container_name: itzephir-opendesign
    # Official 0.27.0 multi-platform image, verified on 2026-11-04.
    image: ghcr.io/nexu-io/od:0.27.0@sha256:c61bb744f057091b4ada678b32142b11f419755713c17203184bbd57cf5057df
    restart: unless-stopped
    labels:
      io.itzephir.service: opendesign
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=192
      OD_BIND_HOST: 0.0.0.0
      OD_PORT: "7456"
      OD_WEB_PORT: "443"
      OD_ALLOWED_ORIGINS: https://opendesign.itzephir.com
      OD_API_TOKEN: ${OD_API_TOKEN:?OpenDesign API token is required}
      OD_DATA_DIR: /app/.od
    ports:
      - "127.0.0.1:7456:7456"
    volumes:
      - workspace:/app/.od
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    mem_limit: 384m
    cpus: 0.75
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:7456/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
volumes:
  workspace:
    external: true
    name: itzephir-opendesign-data
