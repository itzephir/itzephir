# Independent exact hostname; portfolio releases manage their own configuration.
map $http_upgrade $opendesign_connection {
    default upgrade;
    '' close;
}

server {
    listen 80;
    listen [::]:80;
    server_name opendesign.itzephir.com;
    return 308 https://opendesign.itzephir.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name opendesign.itzephir.com;

    ssl_certificate /etc/letsencrypt/live/itzephir-projects-prod/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/itzephir-projects-prod/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    auth_basic "itzephir OpenDesign";
    auth_basic_user_file /etc/nginx/opendesign.htpasswd;
    client_max_body_size 100m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://127.0.0.1:7456;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $opendesign_connection;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
