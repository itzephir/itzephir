# The hostname selects prod or stage; both use /dev/project/SLUG/.
server {
    listen 127.0.0.1:18100;
    server_name _;
    server_tokens off;
    include /etc/nginx/projects/*-prod.conf;
    location / { return 404; }
}
server {
    listen 127.0.0.1:18101;
    server_name _;
    server_tokens off;
    include /etc/nginx/projects/*-dev.conf;
    location / { return 404; }
}
