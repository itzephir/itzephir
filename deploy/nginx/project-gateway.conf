# Compatibility transport for migrated targets. No public portfolio path uses it.
# Existing project CI owns its snippets and rotating ports; the locator stores
# the stable loopback target, never a snapshot of a currently active container.
server {
    listen 127.0.0.1:18100;
    server_name _;
    server_tokens off;
    include /etc/nginx/projects/*-prod.conf;
    location / { return 404; }
}
server {
    listen 127.0.0.1:18101;
    server_name _;
    server_tokens off;
    include /etc/nginx/projects/*-dev.conf;
    location / { return 404; }
}
