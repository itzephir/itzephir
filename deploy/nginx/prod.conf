server {
    listen 80;
    listen [::]:80;
    server_name itzephir.com www.itzephir.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }
    location / { return 301 https://itzephir.com$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.itzephir.com;
    ssl_certificate /etc/letsencrypt/live/itzephir.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/itzephir.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 301 https://itzephir.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name itzephir.com;

    access_log /var/log/nginx/itzephir.com.access.log;
    error_log /var/log/nginx/itzephir.com.error.log;
    ssl_certificate /etc/letsencrypt/live/itzephir.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/itzephir.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    gzip on;
    gzip_comp_level 6;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/javascript text/javascript text/css text/plain image/svg+xml font/ttf;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    location / {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
