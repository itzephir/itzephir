# Source of truth for /etc/nginx/sites-available/itzephir.com.

server {
    listen 80;
    listen [::]:80;
    server_name itzephir.com www.itzephir.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 301 https://itzephir.com$request_uri;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name dev.itzephir.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 301 https://dev.itzephir.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.itzephir.com;

    ssl_certificate /etc/letsencrypt/live/itzephir.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/itzephir.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    return 301 https://itzephir.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name itzephir.com;

    root /srv/itzephir/prod/current;
    index index.html;

    access_log /var/log/nginx/itzephir.com.access.log;
    error_log /var/log/nginx/itzephir.com.error.log;

    ssl_certificate /etc/letsencrypt/live/itzephir.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/itzephir.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    gzip on;
    gzip_static on;
    gzip_comp_level 6;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/javascript application/wasm font/ttf image/svg+xml text/css text/plain;
    brotli_static on;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    location = /index.html {
        try_files $uri @ktor;
        expires -1;
        add_header Cache-Control "no-store";
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location = /itzephir.js {
        try_files $uri @ktor;
        expires -1;
        add_header Cache-Control "no-store";
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location ~* "^/[0-9a-f]{20}\.wasm$" {
        try_files $uri @ktor;
        default_type application/wasm;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location ~* \.wasm$ {
        try_files $uri @ktor;
        default_type application/wasm;
        expires 7d;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location ~* \.(?:css|js|jpg|jpeg|png|svg|webp|ico|ttf)$ {
        try_files $uri @ktor;
        expires 1h;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # During migration nginx can serve a previous static release after rollback.
    # Application distributions contain no index.html, so they use Ktor.
    location / {
        try_files /index.html @ktor;
    }

    location ^~ /assets/ {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location @ktor {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

