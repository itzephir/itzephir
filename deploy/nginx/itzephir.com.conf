# This file is the source of truth for /etc/nginx/sites-available/itzephir.com.
# TLS blocks will be added after the DNS records point to deployment-host.example.invalid.

server {
    listen 80;
    listen [::]:80;
    server_name itzephir.com www.itzephir.com;

    root /srv/itzephir/prod/current;
    index index.html;

    access_log /var/log/nginx/itzephir.com.access.log;
    error_log /var/log/nginx/itzephir.com.error.log;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/javascript application/wasm image/svg+xml text/css text/plain;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    location = /index.html {
        try_files $uri =404;
        expires -1;
        add_header Cache-Control "no-store";
        add_header X-Content-Type-Options nosniff always;
    }

    location ~* "^/[0-9a-f]{20}\.wasm$" {
        default_type application/wasm;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
    }

    location ~* \.wasm$ {
        default_type application/wasm;
        expires 7d;
        add_header X-Content-Type-Options nosniff always;
    }

    location ~* \.(?:css|js|jpg|jpeg|png|svg|webp|ico)$ {
        expires 1h;
        add_header X-Content-Type-Options nosniff always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

